<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARDEBLOAT</title>
  <meta name="description" content="Minimal Windows 10 & 11 Decluttering Engine">
  <meta name="theme-color" content="#FF1E27">
  <link rel="icon" type="image/png" href="/assets/deathstar.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08080A;
      color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 30%, rgba(255, 30, 39, 0.12) 0%, transparent 65%);
    }
    .card {
      max-width: 540px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(255, 30, 39, 0.35);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    h1 span { color: #FF1E27; }
    .cmd-box {
      width: 100%;
      background: #000;
      border: 1px solid #FF1E27;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 25px rgba(255, 30, 39, 0.2);
      margin-bottom: 24px;
    }
    .cmd-text {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.95rem;
      color: #fff;
      overflow-x: auto;
      white-space: nowrap;
    }
    .cmd-prompt {
      color: #FF1E27;
      font-weight: bold;
      user-select: none;
      margin-right: 8px;
    }
    .copy-btn {
      background: #FF1E27;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #ff3840; }
    .actions {
      display: flex;
      gap: 14px;
    }
    .btn {
      background: #121216;
      border: 1px solid #222228;
      color: #C0C0C8;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: #FF1E27;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/deathstar.png" alt="Death Star" class="logo">
    <h1>STAR<span>DEBLOAT</span></h1>

    <div class="cmd-box">
      <div class="cmd-text">
        <span class="cmd-prompt">&gt;</span><span id="cmd">irm https://stardebloat.com/run | iex</span>
      </div>
      <button class="copy-btn" id="btn" onclick="copy()">Copy</button>
    </div>

    <div class="actions">
      <a href="https://github.com/promotezzz/STARDEBLOATER" class="btn" target="_blank" rel="noopener">GitHub</a>
      <a href="/download" class="btn">Download .ZIP</a>
    </div>
  </div>

  <script>
    (function() {
      const o = window.location.origin;
      if (o && !o.startsWith('file:')) {
        document.getElementById('cmd').innerText = 'irm ' + o + '/run | iex';
      }
    })();
    function copy() {
      navigator.clipboard.writeText(document.getElementById('cmd').innerText).then(function() {
        const b = document.getElementById('btn');
        b.innerText = 'Copied!';
        b.style.background = '#27C93F';
        setTimeout(function() {
          b.innerText = 'Copy';
          b.style.background = '#FF1E27';
        }, 1800);
      });
    }
  </script>
</body>
</html>
