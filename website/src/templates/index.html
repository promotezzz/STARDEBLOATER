<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARDEBLOAT</title>
  <meta name="description" content="STARDEBLOAT — Imperial Windows 10 & 11 Decluttering Engine">
  <meta name="theme-color" content="#FF1E27">
  <link rel="icon" type="image/png" href="/assets/deathstar.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020204;
      color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* DEEP SPACE BACKGROUND */
    .space-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #0E070C 0%, #030305 65%, #000002 100%);
    }

    /* STARS IN SPACE */
    .stars {
      position: absolute;
      inset: 0;
      background-repeat: repeat;
    }

    .stars-layer-1 {
      background-image:
        radial-gradient(1px 1px at 35px 50px, #FFFFFF, transparent),
        radial-gradient(1.2px 1.2px at 140px 210px, rgba(255,255,255,0.85), transparent),
        radial-gradient(1.8px 1.8px at 240px 95px, #FFFFFF, transparent),
        radial-gradient(1px 1px at 320px 290px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.2px 1.2px at 410px 160px, #FFFFFF, transparent),
        radial-gradient(1.8px 1.8px at 510px 360px, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 610px 105px, #FFFFFF, transparent),
        radial-gradient(2px 2px at 720px 250px, #FF4D4D, transparent);
      background-size: 750px 750px;
    }

    .stars-layer-2 {
      background-image:
        radial-gradient(1px 1px at 90px 125px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.8px 1.8px at 210px 310px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 370px 70px, rgba(255,255,255,0.45), transparent),
        radial-gradient(1.2px 1.2px at 470px 230px, rgba(255,255,255,0.7), transparent),
        radial-gradient(2.2px 2.2px at 560px 430px, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 670px 170px, #FFFFFF, transparent),
        radial-gradient(1.8px 1.8px at 740px 360px, #FF6B6B, transparent);
      background-size: 600px 600px;
      opacity: 0.85;
    }

    /* DEATH STAR FLOATING IN SPACE */
    .deathstar-space {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(340px, 48vw, 600px);
      height: auto;
      opacity: 0.32;
      filter: drop-shadow(0 0 90px rgba(255, 30, 39, 0.45));
      animation: spaceFloat 10s ease-in-out infinite alternate;
      user-select: none;
    }

    @keyframes spaceFloat {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -52%) rotate(1.8deg); }
    }

    /* MAIN TERMINAL CARD */
    .card {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(6, 6, 10, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 30, 39, 0.35);
      border-radius: 20px;
      padding: 42px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 30, 39, 0.2);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-shadow: 0 0 25px rgba(255, 30, 39, 0.4);
    }

    h1 span {
      color: #FF1E27;
      text-shadow: 0 0 30px #FF1E27;
    }

    .cmd-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #FF1E27;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 25px rgba(255, 30, 39, 0.25);
      margin-bottom: 24px;
    }

    .cmd-text {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.95rem;
      color: #fff;
      overflow-x: auto;
      white-space: nowrap;
    }

    .cmd-prompt {
      color: #FF1E27;
      font-weight: bold;
      user-select: none;
      margin-right: 8px;
    }

    .copy-btn {
      background: #FF1E27;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 0 14px rgba(255, 30, 39, 0.4);
    }

    .copy-btn:hover {
      background: #ff3840;
      transform: translateY(-1px);
    }

    .actions {
      display: flex;
      gap: 14px;
    }

    .btn {
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid #2A2A35;
      color: #D0D0D8;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: #FF1E27;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 30, 39, 0.3);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- SPACE BACKGROUND WITH STARS & DEATH STAR -->
  <div class="space-bg">
    <div class="stars stars-layer-1"></div>
    <div class="stars stars-layer-2"></div>
    <img src="/assets/deathstar.png" alt="Death Star in Space" class="deathstar-space">
  </div>

  <!-- MINIMAL CARD -->
  <div class="card">
    <h1>STAR<span>DEBLOAT</span></h1>

    <div class="cmd-box">
      <div class="cmd-text">
        <span class="cmd-prompt">&gt;</span><span id="cmd">irm https://stardebloat.com/run | iex</span>
      </div>
      <button class="copy-btn" id="btn" onclick="copy()">Copy</button>
    </div>

    <div class="actions">
      <a href="https://github.com/promotezzz/STARDEBLOATER" class="btn" target="_blank" rel="noopener">GitHub</a>
      <a href="/download" class="btn">Download .ZIP</a>
    </div>
  </div>

  <script>
    (function() {
      const o = window.location.origin;
      if (o && !o.startsWith('file:')) {
        document.getElementById('cmd').innerText = 'irm ' + o + '/run | iex';
      }
    })();
    function copy() {
      navigator.clipboard.writeText(document.getElementById('cmd').innerText).then(function() {
        const b = document.getElementById('btn');
        b.innerText = 'Copied!';
        b.style.background = '#27C93F';
        setTimeout(function() {
          b.innerText = 'Copy';
          b.style.background = '#FF1E27';
        }, 1800);
      });
    }
  </script>
</body>
</html>
